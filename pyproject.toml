[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmic-course-project"
version = "0.1.0"
description = "A multi-agent Chinese stand-up comedy generation system"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "autogen-agentchat==0.2.40",
  "python-dotenv>=1,<2",
  "requests>=2.31,<3",
  "streamlit>=1.35,<2",
]

[project.scripts]
openmic = "openmic.cli:main"

[project.optional-dependencies]
evaluation = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "tokenizers>=0.21,<0.22",
  "jsonschema>=4.18,<5",
  "PyYAML>=6,<7",
  "pytest>=8,<9",
]
evaluation-gpu = [
  "torch==2.7.1",
  "transformers==4.49.0",
  "accelerate==1.12.0",
  "safetensors>=0.5.3,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
