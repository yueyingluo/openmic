name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install -e .
      - run: python -c "import autogen; assert autogen.__version__ == '0.2.40', autogen.__version__"
      - run: PYTHONPATH=src python -m unittest discover -s tests -v

  evaluation-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install -e '.[evaluation]'
      - run: python -m pytest -c evaluation/pytest.ini -q evaluation/tests
      - run: python evaluation/runtime/analysis.py --samples evaluation/examples/samples.synthetic.jsonl --ratings evaluation/examples/ratings.synthetic.jsonl --predictions evaluation/examples/predictions.synthetic.jsonl --output artifacts/evaluation-synthetic.json
